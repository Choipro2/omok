<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>우리 반 바둑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.js"></script>
<style>
/* Layout: 첫 화면은 판 크기·모드 카드, 게임 화면은 선수 카드 - 나무 바둑판 - 버튼 줄 (오목과 같은 틀) */
:root{
  --bg:#ecefe8; --panel:#ffffff; --fg:#23281f; --muted:#68705f; --line:#d5dacd;
  --wood-dark:#b98a43;
  --accent:#3a6a9a; --accent-fg:#ffffff; --accent-soft:#dde8f3; --win:#c2412c; --warn:#a8641a;
  --font-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --font-body:"Gowun Dodum",system-ui,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191b; --panel:#212629; --fg:#eef1f2; --muted:#a2abb0; --line:#373e43;
  --accent:#6fa3d6; --accent-fg:#0d1720; --accent-soft:#1e3044; --win:#ff7a63; --warn:#f0a95a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191b; --panel:#212629; --fg:#eef1f2; --muted:#a2abb0; --line:#373e43;
  --accent:#6fa3d6; --accent-fg:#0d1720; --accent-soft:#1e3044; --win:#ff7a63; --warn:#f0a95a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:12px}
.inner{display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0;letter-spacing:.02em}
h2{font-family:var(--font-display);font-weight:400;font-size:1.4rem;margin:0}
.muted{color:var(--muted)}
p{margin:0}

.namebox{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.namebox label{font-family:var(--font-display);font-size:1.15rem}
select{font:inherit;font-size:1.1rem;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
select:focus{outline:none;border-color:var(--accent)}
.picker{display:flex;gap:8px;flex:1;flex-wrap:wrap;min-width:0}
.picker select{flex:1;min-width:88px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:680px){.modes{grid-template-columns:1fr}}
.mode{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mode .tag{font-size:.8rem;letter-spacing:.06em;color:var(--accent);font-weight:700}
.mode p{color:var(--muted);font-size:.95rem;line-height:1.5}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{padding:8px 6px;font-size:1rem}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.record{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:.88rem;color:var(--warn);line-height:1.45}
.note.ok{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password]{font:inherit;font-size:1.1rem;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--accent)}
input[type=password]{width:10ch}
#codeIn{width:6.5ch;text-align:center;letter-spacing:.2em;font-family:var(--font-display);font-size:1.3rem}
input:disabled{opacity:.5}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.numgrid button{padding:12px 4px;font-size:1.15rem;font-variant-numeric:tabular-nums}
.numgrid button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.roombar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:8px 12px}
.roomcode{font-family:var(--font-display);font-size:1.6rem;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.sizebox{flex:1;min-width:240px}

.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0;transition:border-color .2s, box-shadow .2s}
.player.turn{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.stone{width:30px;height:30px;border-radius:50%;flex:none}
.stone.black{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.stone.white{background:radial-gradient(circle at 35% 30%,#fff,#d8d8d2 70%);border:1px solid #9a9a90}
.pinfo{display:flex;flex-direction:column;min-width:0;flex:1}
.pname{font-family:var(--font-display);font-size:1.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo small{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.score{font-family:var(--font-display);font-size:2rem;font-variant-numeric:tabular-nums;min-width:1.5ch;text-align:right}
.status{text-align:center;font-family:var(--font-display);font-size:1.3rem;min-height:1.6em;line-height:1.4}
.status.win{color:var(--win)}
.boardbox{align-self:center;width:min(100%, calc(100vh - 300px), 700px);min-width:280px;max-width:100%}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:10px;box-shadow:0 6px 0 var(--wood-dark),0 10px 24px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

button{font-family:var(--font-display);font-size:1.15rem;border-radius:12px;padding:10px 18px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled,button.primary:disabled{opacity:1;background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.back{font-size:1rem;padding:8px 14px}
@media (max-width:420px){h1{font-size:1.6rem}.score{font-size:1.6rem}button{font-size:1rem;padding:9px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <!-- ===== 첫 화면 ===== -->
  <section id="home" class="inner">
    <header>
      <h1>우리 반 바둑</h1>
      <p class="muted">돌로 집을 더 많이 둘러싸면 이겨요.</p>
    </header>

    <div class="namebox">
      <label for="pGrade">내 이름</label>
      <div class="picker">
        <select id="pGrade" aria-label="학년"></select>
        <select id="pClass" aria-label="반"></select>
        <select id="pNum" aria-label="번호"></select>
      </div>
      <input type="hidden" id="myName">
      <div class="sizebox">
        <div class="seg" role="group" aria-label="바둑판 크기">
          <button data-size="9" aria-pressed="true">9줄</button>
          <button data-size="13" aria-pressed="false">13줄</button>
          <button data-size="19" aria-pressed="false">19줄</button>
        </div>
      </div>
    </div>

    <div class="modes">
      <div class="mode">
        <span class="tag">혼자 연습</span>
        <h2>컴퓨터와 두기</h2>
        <p>컴퓨터를 상대로 연습해요. 처음이면 9줄 쉬움부터!</p>
        <div class="seg" role="group" aria-label="난이도">
          <button data-level="0" aria-pressed="true">쉬움</button>
          <button data-level="1" aria-pressed="false">보통</button>
          <button data-level="2" aria-pressed="false">어려움</button>
        </div>
        <div class="seg" role="group" aria-label="내 돌">
          <button data-me="1" aria-pressed="true">내가 흑(먼저)</button>
          <button data-me="2" aria-pressed="false">내가 백</button>
        </div>
        <p class="record" id="record"></p>
        <button class="primary" id="startAI">연습 시작</button>
      </div>

      <div class="mode">
        <span class="tag">짝과 함께</span>
        <h2>한 컴퓨터로 둘이서</h2>
        <p>컴퓨터 한 대에서 짝과 번갈아 클릭하며 둬요.</p>
        <button class="primary" id="startLocal">같이 시작</button>
      </div>

      <div class="mode">
        <span class="tag">친구와 대전</span>
        <h2>각자 컴퓨터로 두기</h2>
        <p>한 명이 방을 만들고 번호 4자리를 알려 주면, 친구가 그 번호로 들어와요. 판 크기는 방 만든 사람이 정해요.</p>
        <button class="primary" id="createRoom">방 만들기</button>
        <div class="row">
          <input type="text" id="codeIn" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="방 번호">
          <button id="joinRoom">들어가기</button>
        </div>
        <p class="note" id="onlineNote" hidden></p>
        <button id="openTeacher" hidden>학생 승인 관리</button>
      </div>
    </div>
  </section>

  <!-- ===== 선생님: 대전 승인 ===== -->
  <section id="teacher" class="inner" hidden>
    <header>
      <button class="back" id="teacherBack">← 처음으로</button>
      <h2>친구와 대전 승인</h2>
    </header>
    <div class="namebox" id="pinBox">
      <label for="pinIn">선생님 비밀번호</label>
      <input type="password" id="pinIn" autocomplete="off">
      <button class="primary" id="pinOk">확인</button>
      <p class="note" id="pinMsg" hidden></p>
    </div>
    <div id="approveBox" class="inner" hidden>
      <h2 id="classTitle"></h2>
      <p class="muted">초록색 번호의 학생만 방을 만들거나 들어갈 수 있어요. 오목과 바둑에 함께 적용돼요.</p>
      <div class="row">
        <button id="allOn">모두 허락</button>
        <button id="allOff">모두 끄기</button>
        <span class="record" id="approveCount"></span>
      </div>
      <div class="numgrid" id="numGrid"></div>
    </div>
  </section>

  <!-- ===== 게임 화면 ===== -->
  <section id="game" class="inner" hidden>
    <header>
      <button class="back" id="backBtn">← 처음으로</button>
      <h2 id="modeTitle"></h2>
    </header>
    <div class="roombar" id="roomBar" hidden>
      <span>방 번호</span><span class="roomcode" id="roomCode"></span>
      <span class="muted" id="roomInfo"></span>
    </div>
    <section class="players" aria-label="선수">
      <div class="player" id="cardB"><span class="stone black"></span>
        <div class="pinfo"><span class="pname" id="nameBlack"></span><small id="capBlack"></small></div>
        <span class="score" id="scoreBlack">0</span></div>
      <div class="player" id="cardW"><span class="stone white"></span>
        <div class="pinfo"><span class="pname" id="nameWhite"></span><small id="capWhite"></small></div>
        <span class="score" id="scoreWhite">0</span></div>
    </section>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="boardbox"><canvas id="board" aria-label="바둑판"></canvas></div>
    <div class="buttons" id="playButtons">
      <button id="undo">한 수 무르기</button>
      <button id="passBtn">통과(패스)</button>
      <button id="next" class="primary">새 판 (흑백 바꾸기)</button>
    </div>
    <div class="buttons" id="scoreButtons" hidden>
      <button id="resume">계속 두기</button>
      <button id="finish" class="primary">이대로 계산하기</button>
    </div>
  </section>
</div>

<script>
/* ===== 바둑 규칙 엔진 (따내기, 자살수 금지, 패, 집 계산) ===== */
function makeEngine(n){
  const NN = n*n, nb = [], dg = [];
  for(let p=0;p<NN;p++){
    const x=p%n, y=(p/n)|0, a=[], d=[];
    if(x>0)a.push(p-1); if(x<n-1)a.push(p+1); if(y>0)a.push(p-n); if(y<n-1)a.push(p+n);
    for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<n&&ny<n) d.push(ny*n+nx); }
    nb.push(a); dg.push(d);
  }
  const mark = new Int32Array(NN), lmark = new Int32Array(NN); let stamp = 0;
  const stack = new Int32Array(NN);

  // 무리의 돌 목록과 활로 수
  function group(b, p, wantStones){
    stamp++; const c=b[p]; let sp=0, libs=0; const stones = wantStones ? [] : null; let size=0;
    stack[sp++]=p; mark[p]=stamp;
    while(sp){ const q=stack[--sp]; size++; if(stones) stones.push(q);
      for(const r of nb[q]){ const v=b[r];
        if(v===0){ if(lmark[r]!==stamp){ lmark[r]=stamp; libs++; } }
        else if(v===c && mark[r]!==stamp){ mark[r]=stamp; stack[sp++]=r; } } }
    return {libs, size, stones};
  }
  function isEye(b,p,c){
    for(const r of nb[p]) if(b[r]!==c) return false;
    const o=3-c; let bad=0; for(const r of dg[p]) if(b[r]===o) bad++;
    return dg[p].length<4 ? bad===0 : bad<2;
  }
  // 착수: 불가능하면 null
  function play(b,p,c,ko){
    if(b[p]!==0 || p===ko) return null;
    const nbd = b.slice(); nbd[p]=c; const o=3-c, captured=[];
    for(const r of nb[p]) if(nbd[r]===o){ const g=group(nbd,r,true); if(g.libs===0) for(const s of g.stones){ nbd[s]=0; captured.push(s); } }
    const me = group(nbd,p,false);
    if(me.libs===0) return null;                 // 자살수 금지
    let newKo = -1;
    if(captured.length===1 && me.size===1 && me.libs===1) newKo = captured[0];
    return {b:nbd, captured, ko:newKo};
  }
  // 무작위 끝내기 (몬테카를로)
  function playout(b0, toPlay, maxMoves){
    const b=b0.slice(), emp=[]; for(let p=0;p<NN;p++) if(!b[p]) emp.push(p);
    let c=toPlay, passes=0, moves=0;
    while(passes<2 && moves<maxMoves){
      let played=false, L=emp.length, start=(Math.random()*L)|0;
      for(let i=0;i<L;i++){
        const idx=(start+i)%L, p=emp[idx];
        if(isEye(b,p,c)) continue;
        b[p]=c; const o=3-c; let capped=false;
        for(const r of nb[p]) if(b[r]===o){ const g=group(b,r,true); if(g.libs===0){ capped=true; for(const s of g.stones){ b[s]=0; emp.push(s); } } }
        if(!capped && group(b,p,false).libs===0){ b[p]=0; continue; }
        const j=emp.indexOf(p); emp[j]=emp[emp.length-1]; emp.pop();
        played=true; break;
      }
      passes = played ? 0 : passes+1; moves++; c=3-c;
    }
    return b;
  }
  // 집 계산(돌 + 둘러싼 빈 점). dead: 죽은 돌로 볼 위치들
  function area(b, dead){
    const bb=b.slice(); if(dead) for(const p of dead) bb[p]=0;
    const owner=new Int8Array(NN); let black=0, white=0;
    const seen=new Uint8Array(NN);
    for(let p=0;p<NN;p++){
      if(bb[p]){ owner[p]=bb[p]; bb[p]===1?black++:white++; continue; }
      if(seen[p]) continue;
      const reg=[p]; seen[p]=1; let touch=0;
      for(let i=0;i<reg.length;i++) for(const r of nb[reg[i]]){
        if(bb[r]===0){ if(!seen[r]){ seen[r]=1; reg.push(r); } } else touch|=bb[r];
      }
      if(touch===1||touch===2){ for(const q of reg) owner[q]=touch; touch===1?black+=reg.length:white+=reg.length; }
    }
    return {black, white, owner};
  }
  // 각 점이 누구 땅이 될지 추정 (+1 흑, -1 백)
  function ownership(b, toPlay, k){
    const own=new Float32Array(NN);
    for(let i=0;i<k;i++){ const f=playout(b,toPlay,NN*3), a=area(f,null);
      for(let p=0;p<NN;p++) own[p]+= a.owner[p]===1?1:a.owner[p]===2?-1:0; }
    for(let p=0;p<NN;p++) own[p]/=k;
    return own;
  }
  return {n, NN, nb, dg, group, isEye, play, playout, area, ownership};
}

/* ===== 컴퓨터 ===== */
function aiChoose(E, b, c, ko, level, moveNo, komi, opponentPassed){
  const n=E.n, o=3-c, cand=[];
  for(let p=0;p<E.NN;p++){
    if(b[p]) continue;
    if(E.isEye(b,p,c)) continue;
    const r = E.play(b,p,c,ko); if(!r) continue;
    let s = r.captured.length*12;
    const g = E.group(r.b,p,false);
    if(g.libs===1 && !r.captured.length) s -= 10 + g.size*4;      // 단수로 들어가는 수는 피하기
    else if(g.libs===2) s -= 1;
    const seenG=new Set();
    for(const q of E.nb[p]){
      if(b[q]===c){ const gi=E.group(b,q,true); const key=Math.min(...gi.stones); if(seenG.has(key)) continue; seenG.add(key);
        if(gi.libs===1 && g.libs>=2) s += 8 + gi.size*4; }             // 단수 걸린 내 돌 살리기
      if(r.b[q]===o){ const gi=E.group(r.b,q,false); if(gi.libs===1) s += 4 + gi.size*2; else if(gi.libs===2) s += 1; }
    }
    const x=p%n, y=(p/n)|0, line=Math.min(x,y,n-1-x,n-1-y);
    if(moveNo < E.NN/5) s += [-4,-1,2,1.5,0.5][Math.min(line,4)];
    else if(line===0) s -= 1;
    let own=0, emptyN=0; for(const q of E.nb[p]){ if(b[q]===c) own++; else if(!b[q]) emptyN++; }
    if(own>=3) s -= 3;                                                 // 내 집 메우기 피하기
    let near=false; for(const q of E.nb[p].concat(E.dg[p])) if(b[q]){ near=true; break; }
    if(near) s += 0.6;
    s += Math.random()*[6,2,0.6][level];
    cand.push({p,s,cap:r.captured.length});
  }
  cand.sort((a,b)=>b.s-a.s);
  if(!cand.length) return -1;

  // 상대가 통과했고 판이 다 정리되었으면 따라서 통과
  if(opponentPassed){
    const own=E.ownership(b,c,n<=9?60:n<=13?40:24);
    let open=0; for(let p=0;p<E.NN;p++) if(!b[p] && Math.abs(own[p])<0.7) open++;
    if(open <= Math.max(1, E.NN*0.02) && cand[0].cap===0) return -1;
  }
  if(cand[0].s < -2 && moveNo > E.NN/3) return -1;

  // 어려움(9·13줄): 후보 수마다 끝까지 무작위로 두어 보고 이긴 비율로 고르기
  if((level===2 && n<=13) || (level===1 && n<=9)){
    const top=cand.slice(0, level===2?10:6).map(m=>({...m,w:0,v:0}));
    const budget = level===1 ? 300 : n<=9 ? 900 : 1300, t0=performance.now();
    while(performance.now()-t0 < budget){
      for(const m of top){
        const r=E.play(b,m.p,c,ko), f=E.playout(r.b,o,E.NN*3), a=E.area(f,null);
        const diff = a.black - a.white - komi;
        if((c===1 && diff>0) || (c===2 && diff<0)) m.w++;
        m.v++;
      }
    }
    top.sort((a,b)=> (b.w/b.v + b.s*0.002) - (a.w/a.v + a.s*0.002));
    return top[0].p;
  }

    E=makeEngine(size);
    G={mode:'online', code, role:null, wantHost: role==='host', decided:false, subscribed:false, noHost:false, me:'p'+Math.random().toString(36).slice(2,10), partner:false, peerNames:{},
       R:{n:size, moves:[], black:'host', score:{host:0,guest:0}, ver:0, phase:'play', dead:[], result:null}};
    if(role==='host') G.peerNames.host=myName();
    S=fresh(); enterGame(); loadRemote();
    ch=sbc.channel('baduk-room-'+code,{config:{broadcast:{self:false}, presence:{key:G.me}}});
    ch.on('presence',{event:'sync'},onPresence);
    ch.on('broadcast',{event:'hello'},()=>{ if(G.R.ver>0 || G.role==='host') sendState(); });
    ch.on('broadcast',{event:'state'},({payload:P})=>{
      if(!P || typeof P.ver!=='number') return;
      const pby=String(P.by||'');
      if(P.ver < G.R.ver || (P.ver===G.R.ver && pby <= String(G.R.by||''))) return;
      const n=[9,13,19].includes(P.n)?P.n:null; if(!n || !Array.isArray(P.moves) || P.moves.length>n*n*4) return;
      const okInt=v=>Number.isInteger(v)&&v>=-2&&v<n*n;
      if(!P.moves.every(okInt)) return;
      const dead=Array.isArray(P.dead)?P.dead.filter(v=>Number.isInteger(v)&&v>=0&&v<n*n):[];
      const r=P.result && typeof P.result==='object' ? {black:+P.result.black||0, white:+P.result.white||0, winner:P.result.winner===1?1:2} : null;
      G.R={n, moves:P.moves, black:P.black==='guest'?'guest':'host', score:{host:+P.score?.host||0, guest:+P.score?.guest||0},
           ver:P.ver, by:pby, phase:['play','score','done'].includes(P.phase)?P.phase:'play', dead, result:r};
      loadRemote();
    });
    ch.subscribe(status=>{
      if(status==='SUBSCRIBED'){
        G.subscribed = true;
        if(ch.presenceState && Object.keys(ch.presenceState()).length) decideRole();
        setTimeout(decideRole, 3000);   // 방 정보가 늦게 와도 3초 뒤에는 자리 정하기
      } else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        $('status').textContent = '연결이 안 돼요. 인터넷을 확인하고 다시 들어가 보세요.';
      }
    });
  }
  // 자리 정하기: 방 만든 사람은 항상 방장, 들어온 사람은 절대 방장이 되지 않음
  function decideRole(){
    if(G.mode!=='online' || G.decided || !ch) return;
    G.decided = true;
    const list = others(), roles = list.map(p=>p.role);
    if(G.wantHost){
      if(roles.includes('host')){ const old=ch; ch=null; try{ sbc.removeChannel(old); }catch(e){} startOnline(String(Math.floor(1000+Math.random()*9000)), 'host'); return; }  // 같은 번호의 방이 이미 있으면 새 번호로
      G.role = 'host';
    } else {
      G.role = !roles.includes('guest') ? 'guest' : 'watch';
    }
    G.t = Date.now();
    if(G.role!=='watch') ch.track({role:G.role, name:myName(), t:G.t});
    ch.send({type:'broadcast', event:'hello', payload:{}});
    onPresence();
  }
  function others(){
    const st = ch ? ch.presenceState() : {};
    return Object.entries(st).filter(([k])=>k!==G.me).map(([k,v])=>Object.assign({key:k}, v[0]||{}));
  }
  function onPresence(){
    if(G.mode!=='online') return;
    if(!G.decided){ if(G.subscribed) decideRole(); return; }
    const list = others();
    // 같은 자리(방장/친구)가 둘이면 늦게 온 쪽이 구경으로
    if(G.role==='guest' && list.some(p=>p.role==='guest' && ((p.t||0) < G.t || ((p.t||0)===G.t && p.key < G.me)))){
      G.role='watch'; try{ ch.untrack(); }catch(e){}
    }
    G.peerNames = {};
    if(G.role==='host' || G.role==='guest') G.peerNames[G.role] = myName();
    for(const p of [...list].sort((a,b)=>(a.t||0)-(b.t||0))){
      if((p.role==='host'||p.role==='guest') && p.role!==G.role && !G.peerNames[p.role]) G.peerNames[p.role] = String(p.name||'').slice(0,10);
    }
    G.noHost = G.role!=='host' && !list.some(p=>p.role==='host');
    G.partner = G.role==='watch' ? (!!G.peerNames.host && !!G.peerNames.guest)
              : list.some(p=>p.role===(G.role==='host'?'guest':'host'));
    refresh();
  }
  function waitMsg(){
    if(!G.decided) return '방에 들어가는 중…';
    if(G.role==='watch') return '이 방에는 이미 두 명이 있어요. 구경하는 중이에요';
    if(G.noHost) return `${G.code}번 방을 만든 친구가 아직 없어요. 번호를 다시 확인해 주세요`;
    return '친구가 들어오기를 기다려요';
  }
  function commit(){ G.R.ver++; G.R.by=G.me; sendState(); }
  function sendState(){ if(ch) ch.send({type:'broadcast',event:'state',payload:G.R}); }
  // 대전에서 이긴 쪽이 나인지 친구인지
  function winnerSuffix(color){
    if(G.mode!=='online' || G.role==='watch' || !G.role) return '';
    const r = color===1 ? G.R.black : (G.R.black==='host'?'guest':'host');
    return r===G.role ? ' (내가 이겼어요)' : ' (친구가 이겼어요)';
  }

  function leaveOnline(){ if(ch){ try{ sbc.removeChannel(ch); }catch(e){} ch=null; } }

  // ---- 선생님 승인 화면 (오목과 같은 명단·비밀번호) ----
  let pin=''; try{ pin=sessionStorage.getItem('omok.pin')||''; }catch(e){}
  const approved=new Set();
  $('openTeacher').onclick=()=>{ $('home').hidden=true; $('teacher').hidden=false; if(pin) tryPin(pin); else $('pinIn').focus(); };
  $('teacherBack').onclick=()=>{ $('teacher').hidden=true; $('home').hidden=false; checkApproval(); };
  $('pinOk').onclick=()=>tryPin($('pinIn').value);
  $('pinIn').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin($('pinIn').value); });
  async function tryPin(v){
    $('pinMsg').hidden=true;
    const {data,error}=await sbc.rpc('omok_check_pin',{p_pin:v});
    if(error||!data){ pin=''; $('pinMsg').hidden=false; $('pinMsg').textContent=error?'확인하지 못했어요. 잠시 뒤 다시 해 보세요.':'비밀번호가 맞지 않아요.'; return; }
    pin=v; try{ sessionStorage.setItem('omok.pin',v); }catch(e){}
    $('pinBox').hidden=true; $('approveBox').hidden=false;
    await loadApprovals();
  }
  const teacherClass = () => classOf($('myName').value);
  const keyOf = (tc,n) => `${tc.g}${tc.c}${String(n).padStart(2,'0')}`;
  async function loadApprovals(){
    const tc=teacherClass(); if(!tc) return;
    const {data} = await sbc.from('omok_players').select('num,approved').like('num', `${tc.g}${tc.c}%`);
    approved.clear(); (data||[]).forEach(r=>{ if(r.approved) approved.add(r.num); });
    renderGrid();
  }
  function renderGrid(){
    const tc=teacherClass(), g=$('numGrid'); g.textContent=''; if(!tc) return;
    $('classTitle').textContent = `${tc.g}학년 ${tc.c}반`;
    let cnt=0;
    for(let n=1;n<=NUM_MAX;n++){ const k=keyOf(tc,n), on=approved.has(k), b=document.createElement('button'); if(on) cnt++;
      b.textContent=n+'번'; b.title=k; b.setAttribute('aria-pressed', on); b.onclick=()=>setApproval([k], !approved.has(k)); g.appendChild(b); }
    $('approveCount').textContent = `허락 ${cnt}명`;
  }
  async function setApproval(keys,on){
    const {error} = await sbc.rpc('omok_set_approval', {p_pin: pin, p_nums: keys, p_approved: on});
    if(error){ $('approveCount').textContent='저장하지 못했어요. 다시 눌러 주세요.'; return; }
    keys.forEach(k=> on ? approved.add(k) : approved.delete(k)); renderGrid();
  }
  const allKeys = () => { const tc=teacherClass(); return tc ? [...Array(NUM_MAX)].map((_,i)=>keyOf(tc,i+1)) : []; };
  $('allOn').onclick = ()=> setApproval(allKeys(), true);
  $('allOff').onclick = ()=> setApproval(allKeys(), false);

  function maybeAI(){
    if(G.mode!=='ai' || S.phase!=='play' || S.turn===G.me) return;
    clearTimeout(aiTimer);
    aiTimer=setTimeout(()=>{
      if(G.mode!=='ai' || S.phase!=='play' || S.turn===G.me) return;
      const p=aiChoose(E,S.b,S.turn,S.ko,G.level,S.moveNo,KOMI,S.passes>0);
      if(p<0) pass(); else move(p);
    }, 300);
  }
})();
</script>
